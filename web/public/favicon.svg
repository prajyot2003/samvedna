<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="SAMVEDNA">
  <!-- Three bars, longest at the bottom: the three channels of the index,
       weighted as they are weighted. No font dependency, renders anywhere. -->
  <rect width="32" height="32" rx="4" fill="#1f3a6e"/>
  <rect x="8"  y="8"  width="10" height="3" rx="1.5" fill="#ffffff" opacity=".55"/>
  <rect x="8"  y="14.5" width="14" height="3" rx="1.5" fill="#ffffff" opacity=".8"/>
  <rect x="8"  y="21" width="18" height="3" rx="1.5" fill="#ffffff"/>
</svg>
